name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

# 发版机制（npm Trusted Publishing / OIDC，无需 NPM_TOKEN）：
# - 需在 npm 每个包 Settings → Trusted Publisher 配置：GitHub Actions + MengXi-Studio/mengxi-ark + release.yml，并允许 npm publish；
# - 有新 changeset（.changeset/*.md）时生成「版本 PR」，合并后由 pnpm publish 经 OIDC 短时令牌自动发布；
# - 当前处于 pre 模式（tag=beta），发布使用 beta dist-tag，`changeset pre exit` 后才恢复正常版本。
# 注意：本工作流使用 changesets/action@v2 + @changesets/cli v3；pnpm 需 >= 12.12.1 才支持 OIDC 发布。

jobs:
  release:
    runs-on: ubuntu-latest
    # contents/pull-requests：版本分支、tag 与 GitHub Release；id-token：OIDC 信任发布（必需）
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 发布前必须构建：各包 files 声明了 dist，未构建时 tarball 只含 package.json/LICENSE
      - run: pnpm build
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: 'chore(repo): 同步 changeset 版本'
