name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

# 发版机制：
# - 有新 changeset（.changeset/*.md）时生成「版本 PR」，合并后自动发布到 npm；
# - 仓库配置 Secrets.NPM_TOKEN 后自动启用 publish-script，未配置时仅生成版本 PR（不会失败）；
# - 当前处于 pre 模式（tag=beta），发布将使用 beta dist-tag，`changeset pre exit` 后才恢复正常版本。
# 注意：本工作流使用 changesets/action@v2，对应 @changesets/cli v3（v1 action 只兼容 CLI v2）；
# v2 会过滤 .changeset/pre/ 下已消费的预发布 changeset，不会重复计算版本。

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        env:
          # setup-node 的 registry-url 会生成 .npmrc（_authToken=${NODE_AUTH_TOKEN}），供 pnpm/npm publish 鉴权
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          version-script: pnpm version-packages
          # 未配置 NPM_TOKEN 时传入空串，action 视为未提供发布脚本，只创建版本 PR
          publish-script: ${{ secrets.NPM_TOKEN != '' && 'pnpm release' || '' }}
          pr-title: 'chore(repo): 同步 changeset 版本'
