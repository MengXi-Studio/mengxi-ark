name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

# M0 阶段说明：仓库尚未配置 NPM_TOKEN，因此暂不传 publish-script，仅在有新 changeset 时生成「版本 PR」。
# 配置 NPM_TOKEN 后追加 publish-script: pnpm release 即可恢复自动发版。
# 注意：本工作流使用 changesets/action@v2，对应 @changesets/cli v3（v1 action 只兼容 CLI v2）。
# v2 会把 .changeset/pre/ 下已消费的预发布 changeset 过滤掉，不会重复计算版本。

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          pr-title: 'chore(repo): 同步 changeset 版本'
