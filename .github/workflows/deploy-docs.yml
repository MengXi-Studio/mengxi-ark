name: Deploy Docs

# master push 且 docs / changeset 变更时构建并发布文档站到 GitHub Pages；
# 手动触发用于补发（Pages 设置变更、base 调整等）。
# 前置条件：仓库 Settings → Pages → Source 选「GitHub Actions」。

on:
  push:
    branches: [master]
    paths:
      - 'apps/docs/**'
      - '.changeset/**'
      - 'packages/*/CHANGELOG.md'
  workflow_dispatch:

# Pages 部署所需最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新提交取消进行中的部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # docs 不 import 包源码，直接构建即可；gen-changelog 从 packages/*/CHANGELOG.md 聚合
      - run: pnpm --filter docs run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
